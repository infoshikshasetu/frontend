<!DOCTYPE html>
<html>
<head>

<body>

<div class="container section">
  <div class="card" style="max-width:400px;margin:auto;">
    <h2>Student Login</h2>

    <form>

    </form>

    <p style="margin-top:15px;">
      Don't have account?
      <a href="register.html">Register</a>
    </p>
  </div>
</div>

</body>
</html>
