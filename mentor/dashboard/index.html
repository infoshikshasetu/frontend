<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mentor Dashboard | ShikshaSetu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Global CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
</head>
<body>

<div class="dashboard-container">
    <aside class="sidebar">
        <h2>Mentor Panel</h2>
        <ul>
            <li><a href="index.html" class="active">Dashboard</a></li>
            <li><a href="create-course.html">Create Course</a></li>
            <li><a href="my-courses.html">My Courses</a></li>
            <li><a href="students.html">Students</a></li>
            <li><a href="earnings.html">Earnings</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="../index.html">Back to Site</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </aside>

    <main class="dashboard-content">
        <h1>Welcome Back 👋</h1>

        <div class="stats-grid">
            <div class="card">
                <h3>Total Courses</h3>
                <p id="totalCourses">0</p>
            </div>

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card">
                <h3>Total Earnings</h3>
                <p>₹ <span id="totalEarnings">0</span></p>
            </div>
        </div>
    </main>
</div>

<script>
requireMentor();

async function loadDashboard() {
    const response = await ApiRequest.get('/mentor/dashboard', true);

    if (response.success) {
        document.getElementById('totalCourses').innerText = response.data.total_courses;
        document.getElementById('totalStudents').innerText = response.data.total_students;
        document.getElementById('totalEarnings').innerText = response.data.total_earnings;
    }
}

loadDashboard();
</script>

</body>
</html>
