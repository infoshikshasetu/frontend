<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mentor Login | ShikshaSetu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="section">
  <div class="container" style="max-width:400px;">
    <h2>Mentor Login</h2>

    <form id="mentorLoginForm">
      <div class="form-group">
        <input type="email" id="email" placeholder="Email" required>
      </div>

      <div class="form-group">
        <input type="password" id="password" placeholder="Password" required>
      </div>

      <button type="submit" class="btn btn-primary">Login</button>
    </form>
  </div>
</section>

<div id="footer-placeholder"></div>
<div id="modal-placeholder"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
document.getElementById("mentorLoginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  showLoading();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const response = await AuthService.login("/mentor/login", email, password);

    hideLoading();
    showSuccess("Login successful!");

    setTimeout(() => {
      window.location.href = "/mentor/dashboard/index.html";
    }, 1000);

  } catch (error) {
    hideLoading();
    showError(error.message);
  }
});

async function loadComponent(id, file) {
  const res = await fetch(file);
  document.getElementById(id).innerHTML = await res.text();
}

loadComponent("navbar-placeholder", "/components/navbar.html");
loadComponent("footer-placeholder", "/components/footer.html");
loadComponent("modal-placeholder", "/components/modals.html");
</script>

</body>
</html>
