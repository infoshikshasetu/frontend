<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Become a Mentor | ShikshaSetu</title>
  <meta name="description" content="Join ShikshaSetu as a mentor and teach students worldwide.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Global CSS -->
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="hero">
  <div class="container">
    <h1>Teach. Inspire. Earn.</h1>
    <p>Join ShikshaSetu as a mentor and build your online teaching career.</p>
    <a href="register.html" class="btn btn-secondary">Become a Mentor</a>
  </div>
</section>

<section class="section">
  <div class="container section-title">
    <h2>Why Teach With Us?</h2>
  </div>

  <div class="container" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;">
    <div class="card">
      <h3>Global Reach</h3>
      <p>Access students from across the country.</p>
    </div>
    <div class="card">
      <h3>Flexible Earnings</h3>
      <p>Set your pricing and schedule.</p>
    </div>
    <div class="card">
      <h3>Secure Payments</h3>
      <p>Fast and transparent payout system.</p>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<div id="modal-placeholder"></div>

<!-- JS -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
async function loadComponent(id, file) {
  const res = await fetch(file);
  document.getElementById(id).innerHTML = await res.text();
}

loadComponent("navbar-placeholder", "/components/navbar.html");
loadComponent("footer-placeholder", "/components/footer.html");
loadComponent("modal-placeholder", "/components/modals.html");
</script>

</body>
</html>
