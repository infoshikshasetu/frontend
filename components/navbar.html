<!-- =================================
     SHIKSHASETU NAVBAR COMPONENT
================================== -->

<header class="navbar">
  <div class="container navbar-container">

    <!-- Logo -->
    <a href="/index.html" class="logo">
      <strong>ShikshaSetu</strong>
    </a>

    <!-- Navigation Links -->
    <nav class="nav-links" id="navLinks">
      <a href="/index.html">Home</a>
      <a href="/courses.html">Courses</a>
      <a href="/mentors.html">Mentors</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>

      <!-- Dynamic Auth Links -->
      <div class="auth-section">
        <span id="authLinks"></span>
      </div>
    </nav>

  </div>
</header>

<script>
/* ================================
   NAVBAR AUTH LOGIC
================================= */

document.addEventListener("DOMContentLoaded", function () {

  const authContainer = document.getElementById("authLinks");

  if (!authContainer) return;

  const token = localStorage.getItem("shikshasetu_token");
  const user = JSON.parse(localStorage.getItem("shikshasetu_user"));

  if (token && user) {

    let dashboardLink = "/student/dashboard/index.html";

    if (user.role === "mentor") {
      dashboardLink = "/mentor/dashboard/index.html";
    }

    authContainer.innerHTML = `
      <a href="${dashboardLink}" class="btn btn-primary">Dashboard</a>
      <a href="#" id="logoutBtn" class="btn btn-outline">Logout</a>
    `;

    document.getElementById("logoutBtn").addEventListener("click", function (e) {
      e.preventDefault();
      localStorage.removeItem("shikshasetu_token");
      localStorage.removeItem("shikshasetu_user");
      window.location.href = "/index.html";
    });

  } else {

    authContainer.innerHTML = `
      <a href="/student/login.html" class="btn btn-outline">Student Login</a>
      <a href="/student/register.html" class="btn btn-primary">Student Register</a>
      <a href="/mentor/login.html" class="btn btn-outline">Mentor Login</a>
      <a href="/mentor/register.html" class="btn btn-primary">Mentor Register</a>
    `;
  }

});
</script>
